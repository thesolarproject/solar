plugins {
    alias(libs.plugins.android.application)
}

// 2026-07-05 — Standalone companion APK; platform keystore matches Solar for OVERLAY_TRIGGER parity.
def platformKeystore = file("${rootProject.projectDir}/.gradle/platform.keystore")

// 2026-08-01 — Single-APK installability gate (mirrors :app): platform signing only when
// keys/keystore are configured or -PplatformSigningRequested=true / SOLAR_PLATFORM_SIGNING=true.
def platformSigningRequested = {
    def prop = project.findProperty("platformSigningRequested")
    if (prop != null) return prop.toString().equalsIgnoreCase("true")
    def env = System.getenv("SOLAR_PLATFORM_SIGNING")
    if (env != null && !env.isEmpty()) return env.equalsIgnoreCase("true")
    def pk8 = System.getenv("SOLAR_PLATFORM_KEY_PK8")
    def pem = System.getenv("SOLAR_PLATFORM_KEY_PEM")
    if (pk8 != null && !pk8.isEmpty() && pem != null && !pem.isEmpty()) return true
    return platformKeystore.isFile()
}()

tasks.register("ensurePlatformKeystore") {
    doLast {
        if (platformSigningRequested && !platformKeystore.isFile()) {
            exec {
                workingDir rootProject.projectDir
                commandLine "bash", "scripts/ensure-platform-keystore.sh"
            }
        }
    }
}

tasks.named("preBuild").configure { dependsOn("ensurePlatformKeystore") }

android {
    namespace 'com.solar.launcher.globalcontext'
    compileSdk 35

    buildFeatures {
        aidl true
    }

    signingConfigs {
        platform {
            storeFile platformKeystore
            storePassword "android"
            keyAlias "platform"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.solar.launcher.globalcontext"
        minSdk 17
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            signingConfig platformSigningRequested ? signingConfigs.platform : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig platformSigningRequested ? signingConfigs.platform : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // 2026-07-08 — Shared HOME target constants for launcher-picker recovery UI.
            java.srcDirs += [
                    "${rootDir}/solar-rom/vendor/global-input-policy",
                    "${rootDir}/solar-rom/vendor/solar-home-policy"
            ]
        }
        test {
            java.srcDirs += [
                    "${rootDir}/solar-rom/vendor/global-input-policy",
                    "${rootDir}/solar-rom/vendor/solar-home-policy"
            ]
        }
    }
}

dependencies {
    implementation project(':solar-overlay-ui')
    testImplementation libs.junit
    testImplementation libs.mockitoCore
}
