name: Build Solar APK and ROMs

on:
  push:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLAR_GITHUB_REPO: thesolarproject/solar

concurrency:
  group: solar-release-${{ github.ref }}
  cancel-in-progress: true

# APK + OTA publish runs first and is independent of ROM packing.
# ROM failure must not block a successful OTA on thesolarproject/solar-update.

jobs:
  apk-ota:
    name: APK build · GitHub release · OTA catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build start time (UTC)
        run: echo "SOURCE_DATE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Prepare release metadata
        id: meta
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          chmod +x solar-rom/scripts/prepare-release.sh \
            solar-rom/scripts/bump-stable-version.sh \
            solar-rom/scripts/bump-nightly-version.sh \
            solar-rom/scripts/resolve-release-version.py
          # Timestamp tags: YYYYMMDD-HHMM / nightly-YYYYMMDD-HHMM (not sequential nightly-N).
          python3 solar-rom/scripts/resolve-release-version.py --self-test
          ./solar-rom/scripts/prepare-release.sh

      - name: Verify OTA PAT can push to solar-update
        env:
          SOLAR_GITHUB_PAT: ${{ secrets.SOLAR_GITHUB_PAT }}
        run: |
          if [ -z "$SOLAR_GITHUB_PAT" ]; then
            echo "::error::SOLAR_GITHUB_PAT secret is missing — OTA publish requires repo write to thesolarproject/solar-update"
            exit 1
          fi
          curl -fsSIL -H "Authorization: token $SOLAR_GITHUB_PAT" \
            -o /dev/null "https://api.github.com/repos/thesolarproject/solar-update"
          echo "OTA PAT can reach solar-update"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode platform signing keys
        env:
          KEY_PK8_B64: ${{ secrets.SOLAR_PLATFORM_KEY_PK8_B64 }}
          KEY_PEM_B64: ${{ secrets.SOLAR_PLATFORM_KEY_PEM_B64 }}
        run: |
          if [ -z "$KEY_PK8_B64" ] || [ -z "$KEY_PEM_B64" ]; then
            echo "::error::Set SOLAR_PLATFORM_KEY_PK8_B64 and SOLAR_PLATFORM_KEY_PEM_B64 repo secrets"
            exit 1
          fi
          mkdir -p .ci-keys
          printf '%s' "$KEY_PK8_B64" | base64 -d > .ci-keys/platform.pk8
          printf '%s' "$KEY_PEM_B64" | base64 -d > .ci-keys/platform.x509.pem
          echo "SOLAR_PLATFORM_KEY_PK8=$GITHUB_WORKSPACE/.ci-keys/platform.pk8" >> "$GITHUB_ENV"
          echo "SOLAR_PLATFORM_KEY_PEM=$GITHUB_WORKSPACE/.ci-keys/platform.x509.pem" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x gradlew scripts/build.sh
          ./scripts/build.sh
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare release notes (APK-first)
        run: |
          chmod +x solar-rom/scripts/format-release-notes.sh
          ./solar-rom/scripts/format-release-notes.sh release.json > RELEASE_NOTES.md
          {
            echo ""
            echo "## Pipeline"
            echo ""
            echo "- APK + OTA published before ROM packing (ROMs attach when the rom job succeeds)."
          } >> RELEASE_NOTES.md

      - name: Create GitHub release (APK)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Solar ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.short_sha }})
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ github.ref == 'refs/heads/nightly' }}
          generate_release_notes: false

      - name: Publish OTA catalog to solar-update
        env:
          SOLAR_GITHUB_PAT: ${{ secrets.SOLAR_GITHUB_PAT }}
          # Catalog links to solar release assets — do not re-commit APK binaries into solar-update.
          SOLAR_OTA_LINK_RELEASES: "1"
          SOLAR_OTA_PUSH_RETRIES: "10"
        run: |
          chmod +x scripts/publish-ota-updates.sh
          NIGHTLY=false
          if [ "${{ github.ref }}" = "refs/heads/nightly" ]; then NIGHTLY=true; fi
          # Requires GitHub release (previous step) so devices can download app-release.apk from solar.
          ./scripts/publish-ota-updates.sh add \
            --tag "${{ steps.meta.outputs.tag }}" \
            --version-name "${{ steps.meta.outputs.version_name }}" \
            --version-code "${{ steps.meta.outputs.version_code }}" \
            $([ "$NIGHTLY" = true ] && echo --nightly)
          echo "OTA catalog updated on solar-update (APK served from solar release assets)"

      - name: Upload signed APK for ROM job
        uses: actions/upload-artifact@v4
        with:
          name: solar-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Bump stable version for next release
        if: github.ref == 'refs/heads/main'
        run: ./solar-rom/scripts/bump-stable-version.sh

      - name: Commit stable version bump
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.SOLAR_GITHUB_PAT }}
        run: |
          git config user.name "thesolarproject"
          git config user.email "anonymous@local"
          git add app/build.gradle
          if git diff --staged --quiet; then
            echo "No version bump to commit"
            exit 0
          fi
          git commit -m "Bump stable version for next release."
          git push "https://x-access-token:${GH_TOKEN}@github.com/thesolarproject/solar.git" HEAD:main

      - name: Bump nightly version for next release
        if: github.ref == 'refs/heads/nightly'
        run: ./solar-rom/scripts/bump-nightly-version.sh

      - name: Commit nightly version bump
        if: github.ref == 'refs/heads/nightly'
        env:
          GH_TOKEN: ${{ secrets.SOLAR_GITHUB_PAT }}
        run: |
          git config user.name "thesolarproject"
          git config user.email "anonymous@local"
          git add app/build.gradle
          if git diff --staged --quiet; then
            echo "No version bump to commit"
            exit 0
          fi
          git commit -m "Bump nightly version for next release."
          git push "https://x-access-token:${GH_TOKEN}@github.com/thesolarproject/solar.git" HEAD:nightly

      - name: Remove signing keys
        if: always()
        run: rm -rf .ci-keys

  roms:
    name: Pack ROMs · attach to release
    needs: apk-ota
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Continues only after successful APK/OTA; failure here does not undo OTA.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed APK from apk-ota job
        uses: actions/download-artifact@v4
        with:
          name: solar-release-apk
          path: app/build/outputs/apk/release

      - name: Install ROM build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y unzip zip e2fsprogs curl util-linux kmod openssl android-sdk-libsparse-utils
          sudo modprobe loop || true

      - name: Verify ROM base firmware URLs
        run: |
          # y1-community ATA bases only — never rockbox-y1 type-a/b as Solar base.
          curl -fsSIL -o /dev/null "https://github.com/y1-community/y1-ata-rom/releases/download/0.1/rom.zip"
          curl -fsSIL -o /dev/null "https://github.com/y1-community/y1-ata-rom/releases/download/0.1/rom_type_b.zip"
          curl -fsSIL -o /dev/null "https://github.com/y1-community/y2-ata-rom/releases/download/y2-ata/rom_y2.zip"
          curl -fsSIL -o /dev/null "https://github.com/y1-community/a5-ata-rom/releases/download/0.1/rom_a5.zip"
          echo "ROM base sources OK (y1-ata-rom A/B, y2-ata-rom, a5-ata-rom)"

      - name: Build ROM images
        env:
          SOLAR_GITHUB_REPO: thesolarproject/solar
        run: |
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          chmod +x solar-rom/scripts/build-rom.sh
          ./solar-rom/scripts/build-rom.sh a --apk "$APK" "$GITHUB_WORKSPACE/dist/rom.zip"
          ./solar-rom/scripts/build-rom.sh b --apk "$APK" "$GITHUB_WORKSPACE/dist/rom_type_b.zip"
          ./solar-rom/scripts/build-rom.sh y2 --apk "$APK" "$GITHUB_WORKSPACE/dist/rom_y2.zip"
          ./solar-rom/scripts/build-rom.sh a5 --apk "$APK" "$GITHUB_WORKSPACE/dist/rom_a5.zip"
          ls -la dist/
          for z in dist/rom.zip dist/rom_type_b.zip dist/rom_y2.zip dist/rom_a5.zip; do
            test -s "$z" || { echo "::error::Missing or empty $z"; exit 1; }
          done
          unzip -l dist/rom.zip | grep -q MT6572_Android_scatter.txt
          unzip -l dist/rom_type_b.zip | grep -q MT6572_Android_scatter.txt
          unzip -l dist/rom_y2.zip | grep -q MT6582_Android_scatter.txt
          unzip -l dist/rom_a5.zip | grep -q MT6572_Android_scatter.txt
          echo "All four ROM zips built and verified"

      - name: Attach ROMs to existing GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.apk-ota.outputs.tag }}
          files: |
            dist/rom.zip
            dist/rom_type_b.zip
            dist/rom_y2.zip
            dist/rom_a5.zip
          fail_on_unmatched_files: true
          # Append only; do not rewrite release body from APK job
          append_body: false
