plugins {
    alias(libs.plugins.android.application)
}

def configuredBash = project.findProperty("SOLAR_BASH") ?: System.getenv("SOLAR_BASH")
def windowsGitBash = file("${System.getenv("ProgramFiles") ?: "C:/Program Files"}/Git/bin/bash.exe")
def solarBash = configuredBash
        ?: (System.getProperty("os.name").toLowerCase().contains("windows")
        && windowsGitBash.isFile() ? windowsGitBash.absolutePath : "bash")

// 2026-07-05 — versionName/versionCode stamped from SOURCE_DATE_EPOCH at build start (not git commit time).
// syncReleaseVersion → sync-gradle-version.sh; must match OTA tag, About UI, and Reach client version.
// When changing: CI records SOURCE_DATE_EPOCH at checkout in .github/workflows/build-release.yml.

def platformKeystore = file("${rootProject.projectDir}/.gradle/platform.keystore")
def platformKeyPk8 = project.findProperty("SOLAR_PLATFORM_KEY_PK8")
        ?: System.getenv("SOLAR_PLATFORM_KEY_PK8") ?: ""
def platformKeyPem = project.findProperty("SOLAR_PLATFORM_KEY_PEM")
        ?: System.getenv("SOLAR_PLATFORM_KEY_PEM") ?: ""
def platformSigningRequested = platformKeystore.isFile()
        || (platformKeyPk8.toString().trim() && platformKeyPem.toString().trim())

tasks.register("ensurePlatformKeystore") {
    doLast {
        if (!platformKeystore.isFile()) {
            if (!platformKeyPk8.toString().trim() || !platformKeyPem.toString().trim()) {
                throw new GradleException(
                        "Release/platform signing needs SOLAR_PLATFORM_KEY_PK8 and "
                                + "SOLAR_PLATFORM_KEY_PEM. Debug/unit-test builds use "
                                + "the normal local Android debug key when they are absent.")
            }
            exec {
                workingDir rootProject.projectDir
                environment "SOLAR_PLATFORM_KEY_PK8", platformKeyPk8.toString()
                environment "SOLAR_PLATFORM_KEY_PEM", platformKeyPem.toString()
                commandLine solarBash, "scripts/ensure-platform-keystore.sh"
            }
        }
    }
}

tasks.register("syncY1Assets") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            commandLine solarBash, "solar-rom/scripts/sync-y1-assets.sh"
        }
    }
}

tasks.register("syncReleaseVersion") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            environment "SOLAR_RELEASE_CHANNEL", System.getenv("SOLAR_RELEASE_CHANNEL") ?: ""
            commandLine solarBash, "solar-rom/scripts/sync-gradle-version.sh"
        }
    }
}

tasks.named("preBuild").configure { dependsOn("syncY1Assets") }

android {
    namespace 'com.solar.launcher'
    compileSdk 35

    signingConfigs {
        platform {
            storeFile platformKeystore
            storePassword "android"
            keyAlias "platform"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.solar.launcher"
        minSdk 17
        targetSdk 35
        versionCode 3451496
        versionName "nightly-20260724-2056"
        buildConfigField "boolean", "FEATURE_OTA_UPDATE", "true"
        buildConfigField "String", "OTA_UPDATES_URL", "\"https://thesolarproject.github.io/solar-update/updates.xml\""
        def podcastIndexKey = project.findProperty("PODCAST_INDEX_API_KEY") ?: ""
        def podcastIndexSecret = project.findProperty("PODCAST_INDEX_API_SECRET") ?: ""
        buildConfigField "String", "PODCAST_INDEX_API_KEY", "\"${podcastIndexKey}\""
        buildConfigField "String", "PODCAST_INDEX_API_SECRET", "\"${podcastIndexSecret}\""

        def reachDirectoryUrl = project.findProperty("REACH_DIRECTORY_URL") ?: ""
        def reachDirectoryToken = project.findProperty("REACH_DIRECTORY_TOKEN") ?: ""
        buildConfigField "String", "REACH_DIRECTORY_URL", "\"${reachDirectoryUrl}\""
        buildConfigField "String", "REACH_DIRECTORY_TOKEN", "\"${reachDirectoryToken}\""

        // 2026-07-16 — Worker in cloudflare/solar-diag/; issues on thesolarproject/solar-diag. Ingest token only.
        def solarDiagUrl = project.findProperty("SOLAR_DIAG_URL") ?: ""
        def solarDiagToken = project.findProperty("SOLAR_DIAG_TOKEN") ?: ""
        buildConfigField "String", "SOLAR_DIAG_URL", "\"${solarDiagUrl}\""
        buildConfigField "String", "SOLAR_DIAG_TOKEN", "\"${solarDiagToken}\""

        // Official YouTube Data API only. Values come from ignored Gradle properties or CI.
        // A TV/limited-input OAuth client secret is a distributed-client identifier, not a
        // confidential secret; Google currently requires it for device-code polling.
        def quoteBuildConfig = { Object raw ->
            def value = raw != null ? raw.toString() : ""
            return "\"" + value
                    .replace("\\", "\\\\")
                    .replace("\"", "\\\"")
                    .replace("\r", "\\r")
                    .replace("\n", "\\n") + "\""
        }
        def youtubeApiKey = project.findProperty("YOUTUBE_DATA_API_KEY")
                ?: System.getenv("YOUTUBE_DATA_API_KEY") ?: ""
        def youtubeOauthClientId = project.findProperty("YOUTUBE_OAUTH_CLIENT_ID")
                ?: System.getenv("YOUTUBE_OAUTH_CLIENT_ID") ?: ""
        def youtubeOauthClientSecret = project.findProperty("YOUTUBE_OAUTH_CLIENT_SECRET")
                ?: System.getenv("YOUTUBE_OAUTH_CLIENT_SECRET") ?: ""
        buildConfigField "String", "YOUTUBE_DATA_API_KEY", quoteBuildConfig(youtubeApiKey)
        buildConfigField "String", "YOUTUBE_OAUTH_CLIENT_ID", quoteBuildConfig(youtubeOauthClientId)
        buildConfigField "String", "YOUTUBE_OAUTH_CLIENT_SECRET", quoteBuildConfig(youtubeOauthClientSecret)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (platformSigningRequested) {
                signingConfig signingConfigs.platform
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.platform
        }
    }
    buildFeatures {
        buildConfig true
        aidl true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // Freeze inherited findings so lint remains a regression gate for new work.
        baseline = file("lint-baseline.xml")
    }
    sourceSets {
        main {
            java.srcDirs += 'src/api21/java'
            java.srcDirs += "${rootDir}/solar-rom/vendor/global-input-policy"
            java.srcDirs += "${rootDir}/solar-rom/vendor/solar-home-policy"
        }
        test {
            java.srcDir "${rootDir}/solar-rom/vendor/xposed/solar-context-bridge/src/extract"
            java.srcDirs += "${rootDir}/solar-rom/vendor/solar-home-policy"
        }
    }
}

afterEvaluate {
    tasks.named("preReleaseBuild").configure {
        dependsOn("syncReleaseVersion", "ensurePlatformKeystore")
    }
    // adb / local debug APKs get the same UTC build-start stamp as release.
    tasks.named("preDebugBuild").configure { dependsOn("syncReleaseVersion") }
}

dependencies {
    implementation project(':solar-ota-lib')
    implementation project(':solar-overlay-ui')
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // 2026-07-05 — okhttp 3.12.x last branch for API 17; 3.13+ requires API 21.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.13'
    androidTestImplementation libs.ext.junit
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
