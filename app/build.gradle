plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.solar.launcher'
    compileSdk 35

    defaultConfig {
        applicationId "com.solar.launcher"
        minSdk 17
        targetSdk 35
        versionCode 56
        versionName "nightly-56"
        buildConfigField "boolean", "FEATURE_OTA_UPDATE", "true"
        buildConfigField "String", "OTA_UPDATES_URL", "\"https://thesolarproject.github.io/solar-update/updates.xml\""
        def podcastIndexKey = project.findProperty("PODCAST_INDEX_API_KEY") ?: ""
        def podcastIndexSecret = project.findProperty("PODCAST_INDEX_API_SECRET") ?: ""
        buildConfigField "String", "PODCAST_INDEX_API_KEY", "\"${podcastIndexKey}\""
        buildConfigField "String", "PODCAST_INDEX_API_SECRET", "\"${podcastIndexSecret}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java.srcDirs += 'src/api21/java'
        }
    }
}

dependencies {
    implementation project(':core:contracts')
    implementation project(':core:net')
    implementation project(':core:keyboard')
    implementation project(':core:theme')
    implementation project(':core:ui')
    implementation project(':core:playback')
    implementation project(':core:library')
    implementation project(':feature:home')
    implementation project(':feature:apps')
    implementation project(':feature:podcasts')
    implementation project(':feature:reach')
    implementation project(':feature:settings')
    implementation project(':feature:storage')
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    androidTestImplementation libs.ext.junit
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask).configureEach {
    enabled = false
}

// 2026-07-16: package helper APKs into assets/stage when sibling modules have been built.
// First-run SolarDeviceStaging installs them with root — never Rockbox/JJ packages.
tasks.register("packageStageHelpers") {
    doLast {
        def stageDir = file("src/main/assets/stage")
        stageDir.mkdirs()
        def pairs = [
                [file("${rootProject.projectDir}/keyboard-app/build/outputs/apk/release/keyboard-app-release.apk"),
                 new File(stageDir, "keyboard.apk")],
                [file("${rootProject.projectDir}/quickmenu-app/build/outputs/apk/release/quickmenu-app-release.apk"),
                 new File(stageDir, "quickmenu.apk")],
        ]
        pairs.each { src, dest ->
            if (src.exists()) {
                ant.copy(file: src, tofile: dest, overwrite: true)
                logger.lifecycle("stage: ${src.name} -> assets/stage/${dest.name}")
            } else {
                logger.lifecycle("stage: skip missing ${src}")
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn("packageStageHelpers") }
